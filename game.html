<script type="module">
import * as THREE from 'three';
const { scheduleCloudSave, startCloudSync, authState, signUp, signIn, signOut } = (() => {
// Supabase project settings. The anon key is public by design (access is enforced by RLS).
// Leave empty to disable cloud sync; the game then uses localStorage only.
const SUPABASE_URL = 'https://sfeltcffbggvuiggwhlx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_q-cQfk5rQaWFowcHJHYHjw_bXHFZHzD';


const SYNC_KEY = 'dolhareubang_jeju_v1';
const STAMP_KEY = SYNC_KEY + '_cloud_at';
let client = null;
let userId = null;
let user = null;
let timer = null;
let ready = null;

function init() {
  if (ready) return ready;
  ready = (async () => {
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return false;
    try {
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
      client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      let { data: { session } } = await client.auth.getSession();
      if (!session) ({ data: { session } } = await client.auth.signInAnonymously());
      user = session && session.user;
      userId = user && user.id;
      return !!userId;
    } catch (e) { console.warn('[supabase] init failed', e); return false; }
  })();
  return ready;
}

// Pull the cloud save; if it is newer than the local one, store it locally and reload once.
async function pull() {
  const { data, error } = await client.from('game_saves').select('data, updated_at').eq('user_id', userId).maybeSingle();
  if (error || !data) return;
  const localAt = Number(localStorage.getItem(STAMP_KEY) || 0);
  const cloudAt = Date.parse(data.updated_at);
  if (cloudAt > localAt) {
    localStorage.setItem(SYNC_KEY, JSON.stringify(data.data));
    localStorage.setItem(STAMP_KEY, String(cloudAt));
    location.reload();
  }
}

async function push() {
  const raw = localStorage.getItem(SYNC_KEY);
  if (!raw || !client || !userId) return;
  const now = new Date().toISOString();
  const { error } = await client.from('game_saves').upsert({ user_id: userId, data: JSON.parse(raw), updated_at: now });
  if (!error) localStorage.setItem(STAMP_KEY, String(Date.parse(now)));
}

// Call after each local save; uploads are debounced.
function scheduleCloudSave() {
  if (!client) return;
  clearTimeout(timer);
  timer = setTimeout(push, 5000);
}

async function startCloudSync() {
  if (await init()) await pull();
}

/* ---- email / password accounts ---- */

// 'guest' (anonymous), 'user' (email account) or 'off' (Supabase not configured)
async function authState() {
  if (!(await init())) return { mode: 'off' };
  return user.is_anonymous ? { mode: 'guest' } : { mode: 'user', name: unhex(user.email.split('@')[0]) };
}

// Nicknames are mapped to a throw-away address so players never need a real email.
const hex = t => [...new TextEncoder().encode(t)].map(b => b.toString(16).padStart(2, '0')).join('');
const unhex = h => new TextDecoder().decode(Uint8Array.from(h.match(/../g) || [], x => parseInt(x, 16)));
const toEmail = nick => hex(nick.trim().toLowerCase()) + '@dolhareubang.app';
const friendly = m => /already|registered/i.test(m) ? '이미 사용 중인 닉네임이에요' : /invalid login/i.test(m) ? '닉네임 또는 비밀번호가 달라요' : m;
const fail = error => ({ ok: false, message: friendly(error.message) });

// Turns the current guest into an email account, so the existing progress is kept.
async function signUp(nick, password) {
  if (!(await init())) return { ok: false, message: 'Supabase 설정이 필요해요' };
  const { data, error } = await client.auth.updateUser({ email: toEmail(nick), password });
  if (error) return fail(error);
  user = data.user;
  await push();
  return { ok: true, message: '가입 완료! 이제 어디서든 로그인할 수 있어요 🎉' };
}

async function signIn(nick, password) {
  if (!(await init())) return { ok: false, message: 'Supabase 설정이 필요해요' };
  const { data, error } = await client.auth.signInWithPassword({ email: toEmail(nick), password });
  if (error) return fail(error);
  user = data.user; userId = user.id;
  localStorage.removeItem(STAMP_KEY); // let the account's own cloud save win
  await pull();
  return { ok: true, message: '로그인 성공!' };
}

async function signOut() {
  if (!(await init())) return;
  await push(); // flush the latest progress before leaving the account
  await client.auth.signOut();
  localStorage.removeItem(SYNC_KEY);
  localStorage.removeItem(STAMP_KEY);
  location.reload();
}

return { scheduleCloudSave, startCloudSync, authState, signUp, signIn, signOut };
})();

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; };

/* ================= 데이터 ================= */
const CROPS = [
  { id: 'carrot', name: '구좌 당근', icon: '🥕', cost: 5, sell: 14, time: 14, level: 1, xp: 6 },
  { id: 'cabbage', name: '월동 양배추', icon: '🥬', cost: 10, sell: 30, time: 22, level: 2, xp: 10 },
  { id: 'canola', name: '유채꽃', icon: '🌼', cost: 16, sell: 48, time: 28, level: 3, xp: 14 },
  { id: 'tangerine', name: '감귤', icon: '🍊', cost: 24, sell: 80, time: 38, level: 4, xp: 20 },
];

  sel: 0, day: 1, time: 0.22, music: true, voice: true,
  stats: { harvest: 0, water: 0, jump: 0, coins: 0, eggs: 0, star: 0 },
};
startCloudSync();
const SAVE_KEY = 'dolhareubang_jeju_v1';
let saved = null;
try { saved = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
if (saved && saved.S) Object.assign(S, saved.S, { stats: Object.assign(S.stats, saved.S.stats || {}) });

/* ================= 렌더러/씬 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd8ff);
scene.fog = new THREE.Fog(0x8fd8ff, 28, 70);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, .1, 200);
const hemi = new THREE.HemisphereLight(0xffffff, 0x88aa66, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d6, 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 80 });
sun.shadow.bias = -0.0006; scene.add(sun); scene.add(sun.target);
const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .75 }, o));
const mesh = (g, m, x = 0, y = 0, z = 0, cast = true) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = cast; o.receiveShadow = true; return o; };

/* ================= 섬/바다/하늘 ================= */
const sea = mesh(new THREE.CircleGeometry(160, 48), M(0x2fc4d6, { roughness: .25, metalness: .1 }), 0, -1.2, 0, false);
sea.rotation.x = -Math.PI / 2; scene.add(sea);
const island = new THREE.Group(); scene.add(island);
const grass = mesh(new THREE.CylinderGeometry(15, 14, 1.4, 56), M(0x79d65a), 0, -.7, 0, false);
const gtop = grass; island.add(grass);

  butterflies.forEach(b => { const u = b.userData, a = t * u.sp + u.ph; b.position.set(Math.cos(a) * u.r, u.h + Math.sin(t * 2 + u.ph) * .4, Math.sin(a * 1.3) * u.r); b.rotation.y = -a; u.a.rotation.y = Math.sin(t * 20 + u.ph) * .9; u.b.rotation.y = -Math.sin(t * 20 + u.ph) * .9; });
  clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 70) c.position.x = -70; });
  trees.forEach(tr => { tr.rotation.z = Math.sin(t * 1.2 + tr.userData.ph) * .02; tr.scale.y = tr.scale.x * (1 + Math.sin(t * 1.5 + tr.userData.ph) * .015); });
  shrooms.forEach(s => { s.userData.sq = Math.max(0, s.userData.sq - dt * 3); const k = s.userData.sq; s.scale.set(1 + Math.sin(k * 3.14) * .25, 1 - Math.sin(k * 3.14) * .35, 1 + Math.sin(k * 3.14) * .25); });
  stars.forEach(s => {
    const u = s.userData; if (u.alive) { s.rotation.y = t * 2 + u.ph; s.position.y = u.y0 + Math.sin(t * 2 + u.ph) * .25; s.scale.setScalar(1 + Math.sin(t * 5 + u.ph) * .08);
      if (player.position.distanceTo(new THREE.Vector3(s.position.x, s.position.y - .5, s.position.z)) < 1.1) { u.alive = false; u.t = 25; s.visible = false; sfx('star'); sayK('star'); addCoins(5); S.stats.star++; progressQuest('star'); floatText(s.position, '⭐ +5🪙', 'gold'); burst(s.position, 0xffe14d, 24, 4, 3, 1, .1, 3); addXP(2); }
    } else { u.t -= dt; if (u.t <= 0) { u.alive = true; s.visible = true; burst(s.position, 0xffffff, 8, 2, 0, .6); } }
  });
  // 하늘/시간
  updateSky(dt);
  // 아이들 대사 / 저장
  idleT += dt; if (idleT > 40) { idleT = 0; sayK('idle'); }
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }
}
function updateCamera(dt) {
  const f = started ? player.position : new THREE.Vector3(0, 0, 3);
  camTarget.lerp(f, 1 - Math.pow(.004, dt));
  const cd = started ? camDist : 15, cp = started ? camPitch : .6;
  camera.position.set(camTarget.x + Math.sin(camYaw) * Math.cos(cp) * cd, camTarget.y + Math.sin(cp) * cd, camTarget.z + Math.cos(camYaw) * Math.cos(cp) * cd);
  camera.lookAt(camTarget.x, camTarget.y + 1, camTarget.z);
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ S, quests, plots: plots.map(p => ({ s: p.state, c: p.crop, p: p.prog, w: p.wet })) })); } catch (e) {}
  scheduleCloudSave();
}
addEventListener('beforeunload', save);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ================= 시작 ================= */
if (saved && saved.plots) saved.plots.forEach((s, i) => { const p = plots[i]; if (!p) return; p.state = s.s; p.crop = s.c; p.prog = s.p; p.wet = s.w || 0; });
plots.forEach(setPlotVisual);
S.maxWater = Math.max(S.maxWater, 10); S.water = Math.min(S.water, S.maxWater);
buildSlots(); updateHUD(); drawQuests(); setMusic(S.music); $('bVoice').classList.toggle('off', !S.voice); $('bVoice').textContent = S.voice ? '🗣️' : '🤐';
$('loadmsg').textContent = '준비 완료! 버튼을 눌러 시작하세요 🌈';
$('startbtn').onclick = () => {
  initAudio(); if (AC.state === 'suspended') AC.resume(); setMusic(S.music);
  $('title').classList.add('hide'); started = true; sfx('level'); confetti(50);
  setTimeout(() => sayK('start', true), 500);
  toast('🥕 밭을 갈고(E) 씨앗을 심어요!');
};
frame();
window.__game = { S, plots, player, doAction, jump };
</script>
